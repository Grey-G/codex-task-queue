<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Codex Task Queue social preview</title>
  <desc id="desc">Turn product and development docs into executable Codex workflows, then run them with parallel subagents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="48%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="72" y="72" width="1136" height="496" rx="24" fill="#ffffff" opacity="0.06"/>
  <rect x="96" y="96" width="1088" height="448" rx="18" fill="#020617" opacity="0.58"/>
  <text x="128" y="156" fill="#a7f3d0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700">Codex Task Queue</text>
  <text x="128" y="236" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800">Docs to workflows.</text>
  <text x="128" y="304" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800">Workflows to subagents.</text>
  <rect x="128" y="348" width="680" height="6" rx="3" fill="url(#accent)"/>
  <text x="128" y="414" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="500">Turn product and development docs into executable</text>
  <text x="128" y="454" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="500">Codex workflow docs, then run independent READY tasks</text>
  <text x="128" y="494" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="500">with parallel subagents in separate Git worktrees.</text>
  <g transform="translate(846 154)">
    <rect x="0" y="0" width="238" height="64" rx="14" fill="#134e4a"/>
    <text x="24" y="41" fill="#ecfeff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">PRODUCT.md</text>
    <rect x="60" y="104" width="238" height="64" rx="14" fill="#164e63"/>
    <text x="84" y="145" fill="#ecfeff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">TASK_QUEUE.md</text>
    <rect x="0" y="208" width="238" height="64" rx="14" fill="#1d4ed8"/>
    <text x="24" y="249" fill="#eff6ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">subagent T1</text>
    <rect x="60" y="312" width="238" height="64" rx="14" fill="#7c3aed"/>
    <text x="84" y="353" fill="#faf5ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">subagent T2</text>
    <path d="M119 64 L179 104" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/>
    <path d="M179 168 L119 208" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/>
    <path d="M179 168 L179 312" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
